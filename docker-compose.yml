# 本地一键演示：管理站 API + 静态前端（开发用，不进生产部署）
# Local one-command demo: management API + static frontend (local only, not a production deploy)
#
#   docker compose up --build
#   打开 http://127.0.0.1:8090
#   演示账户：admin / auditor / viewer，共享口令 album-mgmt-demo
#   Demo accounts: admin / auditor / viewer with the shared key album-mgmt-demo
#
# 密钥仅注入进程内存；未设置 MGMT_JWT_SECRET 时服务端随机生成（见 application.yml）。
# Secrets live only in process memory; without MGMT_JWT_SECRET a random key is generated.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      MGMT_JWT_SECRET: ${MGMT_JWT_SECRET:-}
      MGMT_DEMO_ACCOUNTS: ${MGMT_DEMO_ACCOUNTS:-admin|admin,auditor|auditor,viewer|viewer}
      MGMT_DEMO_SHARED_KEY: ${MGMT_DEMO_SHARED_KEY:-album-mgmt-demo}
    expose:
      - "8080"

  web:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
