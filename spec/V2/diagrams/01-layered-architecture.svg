<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#A9A49C"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8A9A86"/>
    </marker>
  </defs>

  <rect width="1240" height="880" fill="#FAF9F7"/>

  <!-- Title -->
  <text x="60" y="46" font-size="22" font-weight="600" fill="#2E3134">Console One · 分层架构</text>
  <text x="60" y="70" font-size="12.5" fill="#8A9095">模块化单体 + 单一 PostgreSQL · 只读采集 · 变更走 Git 与 Terraform</text>

  <!-- ============ L4 UI ============ -->
  <rect x="150" y="92" width="940" height="72" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <rect x="150" y="92" width="4" height="72" rx="2" fill="#7C8894"/>
  <text x="168" y="112" font-size="11.5" font-weight="600" fill="#8A9095">L4 · 展现层</text>
  <rect x="168" y="120" width="904" height="32" rx="6" fill="#F4F3F0" stroke="#E2DFD9"/>
  <text x="620" y="141" font-size="13.5" fill="#3A3E42" text-anchor="middle">React SPA · 总览 / 资源目录 / 成本分析 / 漂移 / 流水线 / 安全 / 事件 · 路由级代码分割</text>

  <!-- ============ L3 API ============ -->
  <rect x="150" y="180" width="940" height="66" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <rect x="150" y="180" width="4" height="66" rx="2" fill="#6B7F94"/>
  <text x="168" y="200" font-size="11.5" font-weight="600" fill="#8A9095">L3 · 服务层</text>
  <rect x="168" y="208" width="904" height="30" rx="6" fill="#EDF1F4" stroke="#CBD5DE"/>
  <text x="620" y="228" font-size="13" fill="#4A5A69" text-anchor="middle">web 模块 · REST API + BFF 聚合 · 行级权限裁剪 · SSE 推送 · 唯一对外出口</text>

  <!-- ============ L2 Domain ============ -->
  <rect x="150" y="262" width="940" height="224" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <rect x="150" y="262" width="4" height="224" rx="2" fill="#8A9A86"/>
  <text x="168" y="282" font-size="11.5" font-weight="600" fill="#8A9095">L2 · 领域层</text>
  <text x="1072" y="282" font-size="11" fill="#A9A49C" text-anchor="end">边界由 ApplicationModules.verify() 强制</text>

  <!-- row 1 -->
  <rect x="164" y="290" width="292" height="54" rx="8" fill="#EDF1F4" stroke="#C3CFDA"/>
  <text x="310" y="312" font-size="13" font-weight="600" fill="#43536B" text-anchor="middle">catalog</text>
  <text x="310" y="330" font-size="11" fill="#6B7F94" text-anchor="middle">资源主数据 · 关系 · 标签策略</text>

  <rect x="474" y="290" width="292" height="54" rx="8" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="620" y="312" font-size="13" font-weight="600" fill="#6E5B49" text-anchor="middle">collector</text>
  <text x="620" y="330" font-size="11" fill="#A8907E" text-anchor="middle">云 API · Terraform state · 限流重试</text>

  <rect x="784" y="290" width="292" height="54" rx="8" fill="#F7EDEA" stroke="#E3C7BE"/>
  <text x="930" y="312" font-size="13" font-weight="600" fill="#8A5C4E" text-anchor="middle">drift</text>
  <text x="930" y="330" font-size="11" fill="#C08B7D" text-anchor="middle">差异计算 · 漂移判定 · PR 建议</text>

  <!-- row 2 -->
  <rect x="164" y="356" width="292" height="54" rx="8" fill="#EEF2ED" stroke="#C6D2C2"/>
  <text x="310" y="378" font-size="13" font-weight="600" fill="#4E6349" text-anchor="middle">cost</text>
  <text x="310" y="396" font-size="11" fill="#8A9A86" text-anchor="middle">账单归一 · 归因 · 分摊 · 预算 · 异常</text>

  <rect x="474" y="356" width="292" height="54" rx="8" fill="#F2F0F4" stroke="#D2CCD8"/>
  <text x="620" y="378" font-size="13" font-weight="600" fill="#5B5468" text-anchor="middle">delivery</text>
  <text x="620" y="396" font-size="11" fill="#8C8497" text-anchor="middle">GitHub App · 门禁 · 回滚 · DORA</text>

  <rect x="784" y="356" width="292" height="54" rx="8" fill="#ECF2F1" stroke="#C0D2D0"/>
  <text x="930" y="378" font-size="13" font-weight="600" fill="#45605E" text-anchor="middle">signal</text>
  <text x="930" y="396" font-size="11" fill="#7E9A99" text-anchor="middle">告警摄入 · 收敛关联 · 事件时间线</text>

  <!-- row 3 -->
  <rect x="164" y="422" width="292" height="54" rx="8" fill="#F6F1EC" stroke="#DBCBBC"/>
  <text x="310" y="444" font-size="13" font-weight="600" fill="#7A6048" text-anchor="middle">posture</text>
  <text x="310" y="462" font-size="11" fill="#B09074" text-anchor="middle">CSPM 导入 · IAM 风险 · 密钥泄露</text>

  <rect x="474" y="422" width="292" height="54" rx="8" fill="#FFFFFF" stroke="#A9B4C0" stroke-width="1.4"/>
  <text x="620" y="444" font-size="13" font-weight="600" fill="#3A4653" text-anchor="middle">web</text>
  <text x="620" y="462" font-size="11" fill="#6B7F94" text-anchor="middle">唯一对外出口 · 聚合读模型</text>

  <rect x="784" y="422" width="292" height="54" rx="8" fill="#F7F6F3" stroke="#DDD9D2" stroke-dasharray="4 3"/>
  <text x="930" y="444" font-size="11" fill="#8A9095" text-anchor="middle">跨模块通信</text>
  <text x="930" y="462" font-size="11" fill="#A9A49C" text-anchor="middle">领域事件 · 禁止反向同步调用</text>

  <!-- ============ L1 Ingestion ============ -->
  <rect x="150" y="502" width="940" height="104" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <rect x="150" y="502" width="4" height="104" rx="2" fill="#A8907E"/>
  <text x="168" y="522" font-size="11.5" font-weight="600" fill="#8A9095">L1 · 接入层</text>

  <rect x="171" y="534" width="170" height="56" rx="7" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="256" y="557" font-size="12" font-weight="600" fill="#6E5B49" text-anchor="middle">云 API 适配器</text>
  <text x="256" y="575" font-size="10.5" fill="#A8907E" text-anchor="middle">AWS / GCP / Azure</text>

  <rect x="353" y="534" width="170" height="56" rx="7" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="438" y="557" font-size="12" font-weight="600" fill="#6E5B49" text-anchor="middle">Terraform state</text>
  <text x="438" y="575" font-size="10.5" fill="#A8907E" text-anchor="middle">读 backend · show -json</text>

  <rect x="535" y="534" width="170" height="56" rx="7" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="620" y="557" font-size="12" font-weight="600" fill="#6E5B49" text-anchor="middle">GitHub App</text>
  <text x="620" y="575" font-size="10.5" fill="#A8907E" text-anchor="middle">Webhook · 幂等去重</text>

  <rect x="717" y="534" width="170" height="56" rx="7" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="802" y="557" font-size="12" font-weight="600" fill="#6E5B49" text-anchor="middle">告警 Webhook</text>
  <text x="802" y="575" font-size="10.5" fill="#A8907E" text-anchor="middle">CloudWatch · Alertmanager</text>

  <rect x="899" y="534" width="170" height="56" rx="7" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="984" y="557" font-size="12" font-weight="600" fill="#6E5B49" text-anchor="middle">账单导入</text>
  <text x="984" y="575" font-size="10.5" fill="#A8907E" text-anchor="middle">CUR · BQ · Cost Export</text>

  <!-- ============ 横切 ============ -->
  <rect x="150" y="622" width="940" height="78" rx="10" fill="#FFFFFF" stroke="#E2DFD9" stroke-dasharray="5 3"/>
  <text x="168" y="642" font-size="11.5" font-weight="600" fill="#8A9095">横切 · 所有模块依赖</text>

  <rect x="180" y="650" width="280" height="36" rx="7" fill="#F2F0F4" stroke="#D2CCD8"/>
  <text x="320" y="673" font-size="12" fill="#5B5468" text-anchor="middle">identity · RBAC + scope 授权</text>

  <rect x="480" y="650" width="280" height="36" rx="7" fill="#F2F0F4" stroke="#D2CCD8"/>
  <text x="620" y="673" font-size="12" fill="#5B5468" text-anchor="middle">audit · append-only 哈希链</text>

  <rect x="780" y="650" width="280" height="36" rx="7" fill="#F2F0F4" stroke="#D2CCD8"/>
  <text x="920" y="673" font-size="12" fill="#5B5468" text-anchor="middle">shared · Money / TagSet / 分页</text>

  <!-- ============ External ============ -->
  <text x="168" y="728" font-size="11.5" font-weight="600" fill="#8A9095">外部系统 · 只读</text>

  <rect x="171" y="740" width="170" height="60" rx="7" fill="#FFFFFF" stroke="#CFCAC2" stroke-dasharray="3 3"/>
  <text x="256" y="765" font-size="12" fill="#5F6569" text-anchor="middle">AWS · GCP · Azure</text>
  <text x="256" y="783" font-size="10.5" fill="#A9A49C" text-anchor="middle">10 个账号 / 2k 资源</text>

  <rect x="353" y="740" width="170" height="60" rx="7" fill="#FFFFFF" stroke="#CFCAC2" stroke-dasharray="3 3"/>
  <text x="438" y="765" font-size="12" fill="#5F6569" text-anchor="middle">GitHub</text>
  <text x="438" y="783" font-size="10.5" fill="#A9A49C" text-anchor="middle">Actions · Deployments</text>

  <rect x="535" y="740" width="170" height="60" rx="7" fill="#FFFFFF" stroke="#CFCAC2" stroke-dasharray="3 3"/>
  <text x="620" y="765" font-size="12" fill="#5F6569" text-anchor="middle">Terraform Backend</text>
  <text x="620" y="783" font-size="10.5" fill="#A9A49C" text-anchor="middle">S3 + DynamoDB lock</text>

  <rect x="717" y="740" width="170" height="60" rx="7" fill="#FFFFFF" stroke="#CFCAC2" stroke-dasharray="3 3"/>
  <text x="802" y="765" font-size="12" fill="#5F6569" text-anchor="middle">可观测体系</text>
  <text x="802" y="783" font-size="10.5" fill="#A9A49C" text-anchor="middle">Prometheus · CloudWatch</text>

  <rect x="899" y="740" width="170" height="60" rx="7" fill="#FFFFFF" stroke="#CFCAC2" stroke-dasharray="3 3"/>
  <text x="984" y="765" font-size="12" fill="#5F6569" text-anchor="middle">飞书</text>
  <text x="984" y="783" font-size="10.5" fill="#A9A49C" text-anchor="middle">卡片告警与周报</text>

  <!-- connectors -->
  <line x1="620" y1="164" x2="620" y2="178" stroke="#A9A49C" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="620" y1="246" x2="620" y2="260" stroke="#A9A49C" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="620" y1="486" x2="620" y2="500" stroke="#A9A49C" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="620" y1="606" x2="620" y2="620" stroke="#A9A49C" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="620" y1="700" x2="620" y2="736" stroke="#A9A49C" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar2)"/>

  <text x="60" y="846" font-size="11" fill="#A9A49C">单一 PostgreSQL 16 · 无 Redis / 无 Kafka / 无 ES · 部署为 Docker Compose 单实例</text>
</svg>
