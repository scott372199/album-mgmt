<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" width="1240" height="810" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1240" height="810" fill="#FAF9F7"/>

  <text x="40" y="42" font-size="21" font-weight="600" fill="#2E3134">多云统一模型 · 同一件事，三种说法</text>
  <text x="40" y="66" font-size="12" fill="#8A9095">多云的难点不是"连接三个 API"，而是三云在身份、类型、标签、区域上完全不兼容。不在模型层统一，平台就退化成"一页放三个控制台"</text>

  <!-- ===== 原生差异：三列 ===== -->
  <!-- AWS -->
  <rect x="40" y="86" width="380" height="222" rx="10" fill="#FFFFFF" stroke="#C3CFDA"/>
  <rect x="40" y="86" width="380" height="30" rx="10" fill="#EDF1F4"/>
  <rect x="40" y="106" width="380" height="10" fill="#EDF1F4"/>
  <text x="58" y="106" font-size="12.5" font-weight="600" fill="#43536B">AWS</text>
  <text x="400" y="106" font-size="10.5" fill="#6B7F94" text-anchor="end">层级深度 3</text>

  <text x="58" y="138" font-size="11.5" fill="#3A3E42">Organization</text>
  <line x1="62" y1="146" x2="62" y2="162" stroke="#C3CFDA"/>
  <line x1="62" y1="162" x2="76" y2="162" stroke="#C3CFDA"/>
  <text x="82" y="166" font-size="11.5" fill="#3A3E42">OU（可嵌套）</text>
  <line x1="86" y1="174" x2="86" y2="190" stroke="#C3CFDA"/>
  <line x1="86" y1="190" x2="100" y2="190" stroke="#C3CFDA"/>
  <text x="106" y="194" font-size="11.5" fill="#3A3E42">Account ← 资源容器</text>
  <line x1="110" y1="202" x2="110" y2="216" stroke="#C3CFDA"/>
  <line x1="110" y1="216" x2="124" y2="216" stroke="#C3CFDA"/>
  <text x="130" y="220" font-size="11" fill="#8A9095">资源</text>

  <line x1="58" y1="236" x2="402" y2="236" stroke="#F0EDE7"/>
  <text x="58" y="256" font-size="10.8" fill="#7A8085">标签 Tag · 上限 50 · key 大小写<b>敏感</b></text>
  <text x="58" y="274" font-size="10.8" fill="#7A8085">区域 ap-northeast-1</text>
  <text x="58" y="292" font-size="10.8" fill="#6B7F94">聚合 API：Resource Explorer + Tagging API</text>

  <!-- GCP -->
  <rect x="430" y="86" width="380" height="222" rx="10" fill="#FFFFFF" stroke="#C6D2C2"/>
  <rect x="430" y="86" width="380" height="30" rx="10" fill="#EEF2ED"/>
  <rect x="430" y="106" width="380" height="10" fill="#EEF2ED"/>
  <text x="448" y="106" font-size="12.5" font-weight="600" fill="#3E5239">GCP</text>
  <text x="790" y="106" font-size="10.5" fill="#8A9A86" text-anchor="end">层级深度 4</text>

  <text x="448" y="138" font-size="11.5" fill="#3A3E42">Organization</text>
  <line x1="452" y1="146" x2="452" y2="162" stroke="#C6D2C2"/>
  <line x1="452" y1="162" x2="466" y2="162" stroke="#C6D2C2"/>
  <text x="472" y="166" font-size="11.5" fill="#3A3E42">Folder（可嵌套）</text>
  <line x1="476" y1="174" x2="476" y2="190" stroke="#C6D2C2"/>
  <line x1="476" y1="190" x2="490" y2="190" stroke="#C6D2C2"/>
  <text x="496" y="194" font-size="11.5" fill="#3A3E42">Project ← 资源容器</text>
  <line x1="500" y1="202" x2="500" y2="216" stroke="#C6D2C2"/>
  <line x1="500" y1="216" x2="514" y2="216" stroke="#C6D2C2"/>
  <text x="520" y="220" font-size="11" fill="#8A9095">资源</text>

  <line x1="448" y1="236" x2="792" y2="236" stroke="#F0EDE7"/>
  <text x="448" y="256" font-size="10.8" fill="#7A8085">标签 Label · 上限 64 · key/value <b>只能小写</b></text>
  <text x="448" y="274" font-size="10.8" fill="#7A8085">区域 asia-northeast1</text>
  <text x="448" y="292" font-size="10.8" fill="#4E6349">聚合 API：Cloud Asset Inventory（自带 relatedAssets）</text>

  <!-- Azure -->
  <rect x="820" y="86" width="380" height="222" rx="10" fill="#FFFFFF" stroke="#E3C7BE"/>
  <rect x="820" y="86" width="380" height="30" rx="10" fill="#FAEDE9"/>
  <rect x="820" y="106" width="380" height="10" fill="#FAEDE9"/>
  <text x="838" y="106" font-size="12.5" font-weight="600" fill="#8A5C4E">Azure</text>
  <text x="1180" y="106" font-size="10.5" fill="#C08B7D" text-anchor="end">层级深度 5</text>

  <text x="838" y="138" font-size="11.5" fill="#3A3E42">Tenant</text>
  <line x1="842" y1="146" x2="842" y2="160" stroke="#E3C7BE"/>
  <line x1="842" y1="160" x2="856" y2="160" stroke="#E3C7BE"/>
  <text x="862" y="164" font-size="11.5" fill="#3A3E42">Management Group（可嵌套 6 层）</text>
  <line x1="866" y1="172" x2="866" y2="186" stroke="#E3C7BE"/>
  <line x1="866" y1="186" x2="880" y2="186" stroke="#E3C7BE"/>
  <text x="886" y="190" font-size="11.5" fill="#3A3E42">Subscription</text>
  <line x1="890" y1="198" x2="890" y2="212" stroke="#E3C7BE"/>
  <line x1="890" y1="212" x2="904" y2="212" stroke="#E3C7BE"/>
  <text x="910" y="216" font-size="11.5" fill="#8A5C4E">Resource Group ← 多一层</text>
  <line x1="914" y1="224" x2="914" y2="236" stroke="#E3C7BE"/>
  <line x1="914" y1="236" x2="928" y2="236" stroke="#E3C7BE"/>
  <text x="934" y="240" font-size="11" fill="#8A9095">资源</text>

  <line x1="838" y1="252" x2="1182" y2="252" stroke="#F0EDE7"/>
  <text x="838" y="272" font-size="10.8" fill="#7A8085">标签 Tag · 上限 50 · key 大小写<b>不敏感</b></text>
  <text x="838" y="290" font-size="10.8" fill="#7A8085">区域 japaneast</text>
  <text x="838" y="306" font-size="10.8" fill="#8A5C4E">聚合 API：Resource Graph（KQL 全租户）</text>

  <!-- 归一化箭头 -->
  <line x1="230" y1="308" x2="230" y2="324" stroke="#A9A49C" stroke-width="1.4"/>
  <line x1="620" y1="308" x2="620" y2="324" stroke="#A9A49C" stroke-width="1.4"/>
  <line x1="1010" y1="308" x2="1010" y2="324" stroke="#A9A49C" stroke-width="1.4"/>

  <!-- ===== 六层统一 ===== -->
  <rect x="40" y="324" width="1160" height="86" rx="10" fill="#FFFFFF" stroke="#DDD9D2" stroke-dasharray="5 3"/>
  <text x="58" y="344" font-size="11.5" font-weight="600" fill="#8A9095">归一化六层 —— 统一到"能对比、能串联"的粒度就停下，剩下的差异原样暴露</text>

  <rect x="56" y="354" width="180" height="42" rx="7" fill="#EDF1F4" stroke="#C3CFDA"/>
  <text x="146" y="372" font-size="11" font-weight="600" fill="#43536B" text-anchor="middle">身份层级</text>
  <text x="146" y="387" font-size="9.8" fill="#6B7F94" text-anchor="middle">scope_node 可嵌套树</text>

  <rect x="246" y="354" width="180" height="42" rx="7" fill="#EEF2ED" stroke="#C6D2C2"/>
  <text x="336" y="372" font-size="11" font-weight="600" fill="#3E5239" text-anchor="middle">资源类型</text>
  <text x="336" y="387" font-size="9.8" fill="#8A9A86" text-anchor="middle">canonical_type</text>

  <rect x="436" y="354" width="180" height="42" rx="7" fill="#F5F0EA" stroke="#DCCFBE"/>
  <text x="526" y="372" font-size="11" font-weight="600" fill="#6E5B49" text-anchor="middle">标签语义</text>
  <text x="526" y="387" font-size="9.8" fill="#A8907E" text-anchor="middle">canonical key + 映射</text>

  <rect x="626" y="354" width="180" height="42" rx="7" fill="#F3F1F5" stroke="#DAD4E0"/>
  <text x="716" y="372" font-size="11" font-weight="600" fill="#5B5468" text-anchor="middle">成本口径</text>
  <text x="716" y="387" font-size="9.8" fill="#8C8497" text-anchor="middle">FOCUS 字段子集</text>

  <rect x="816" y="354" width="180" height="42" rx="7" fill="#ECF2F1" stroke="#C0D2D0"/>
  <text x="906" y="372" font-size="11" font-weight="600" fill="#45605E" text-anchor="middle">区域</text>
  <text x="906" y="387" font-size="9.8" fill="#7E9A99" text-anchor="middle">canonical + metro 同城归组</text>

  <rect x="1006" y="354" width="180" height="42" rx="7" fill="#FAEDE9" stroke="#E3C7BE"/>
  <text x="1096" y="372" font-size="11" font-weight="600" fill="#8A5C4E" text-anchor="middle">能力矩阵</text>
  <text x="1096" y="387" font-size="9.8" fill="#C08B7D" text-anchor="middle">同能力三云对照 + support</text>

  <!-- ===== 三张产物 ===== -->
  <text x="40" y="440" font-size="12" font-weight="600" fill="#5F6569">统一后的三张核心表</text>

  <!-- 卡片1 scope_node -->
  <rect x="40" y="452" width="380" height="212" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <text x="58" y="474" font-size="12" font-weight="600" fill="#43536B">① scope_node · 层级不写死深度</text>
  <text x="58" y="494" font-size="10.3" fill="#7A8085">parent_id 自引用 + LTREE 物化路径，任意深度都能挂</text>

  <rect x="58" y="504" width="344" height="24" rx="4" fill="#F4F3F0"/>
  <text x="66" y="520" font-size="8.8" fill="#8A9095">kind</text>
  <text x="150" y="520" font-size="8.8" fill="#8A9095">native_id</text>
  <text x="270" y="520" font-size="8.8" fill="#8A9095">path (ltree)</text>
  <text x="66" y="540" font-size="9.3" fill="#43536B">ORG</text>
  <text x="150" y="540" font-size="9.3" fill="#5F6569">o-abc123</text>
  <text x="270" y="540" font-size="9.3" fill="#5F6569">org</text>
  <text x="66" y="557" font-size="9.3" fill="#43536B">PROJECT</text>
  <text x="150" y="557" font-size="9.3" fill="#5F6569">analytics-prod</text>
  <text x="270" y="557" font-size="9.3" fill="#5F6569">org.5.proj.9</text>
  <text x="66" y="574" font-size="9.3" fill="#43536B">SUBSCRIPTION</text>
  <text x="150" y="574" font-size="9.3" fill="#5F6569">sub-corp-it</text>
  <text x="270" y="574" font-size="9.3" fill="#5F6569">org.3.sub.s2</text>
  <text x="66" y="591" font-size="9.3" fill="#8A5C4E">RESOURCE_GROUP</text>
  <text x="150" y="591" font-size="9.3" fill="#5F6569">rg-bridge</text>
  <text x="270" y="591" font-size="9.3" fill="#5F6569">org.3.sub.s2.rg.r7</text>

  <text x="58" y="616" font-size="10" fill="#7A8085">一个 LTREE 查询就能取"某 BU 下全部资源"：</text>
  <text x="58" y="634" font-size="9.3" fill="#4E6349" font-family="'SF Mono', Consolas, monospace">WHERE path &lt;@ 'org.3.sub'</text>
  <text x="58" y="652" font-size="9.8" fill="#A9A49C">不需要图数据库，PG 原生就够</text>

  <!-- 卡片2 能力矩阵 -->
  <rect x="430" y="452" width="380" height="212" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <text x="448" y="474" font-size="12" font-weight="600" fill="#3E5239">② canonical_type · 能力矩阵</text>
  <text x="448" y="494" font-size="10.3" fill="#7A8085">横向对比与拓扑串联的锚，同时标注"某云没有对等物"</text>

  <rect x="444" y="504" width="352" height="22" rx="4" fill="#F4F3F0"/>
  <text x="450" y="519" font-size="8.8" fill="#8A9095">canonical</text>
  <text x="522" y="519" font-size="8.8" fill="#8A9095">AWS</text>
  <text x="627" y="519" font-size="8.8" fill="#8A9095">GCP</text>
  <text x="730" y="519" font-size="8.8" fill="#8A9095">Azure</text>
  <line x1="444" y1="532" x2="796" y2="532" stroke="#F0EDE7"/>
  <text x="450" y="546" font-size="9.2" fill="#43536B">edge.cdn</text>
  <text x="522" y="546" font-size="9.2" fill="#5F6569">CloudFront</text>
  <text x="627" y="546" font-size="9.2" fill="#5F6569">Cloud CDN</text>
  <text x="730" y="546" font-size="9.2" fill="#5F6569">Front Door</text>
  <line x1="444" y1="554" x2="796" y2="554" stroke="#F0F0F0"/>
  <text x="450" y="568" font-size="9.2" fill="#43536B">cert.managed</text>
  <text x="522" y="568" font-size="9.2" fill="#5F6569">ACM</text>
  <text x="627" y="568" font-size="9.2" fill="#5F6569">Google SSL</text>
  <text x="730" y="568" font-size="9.2" fill="#5F6569">Key Vault</text>
  <line x1="444" y1="576" x2="796" y2="576" stroke="#F0F0F0"/>
  <text x="450" y="590" font-size="9.2" fill="#43536B">secret</text>
  <text x="522" y="590" font-size="9.2" fill="#5F6569">Secrets Mgr</text>
  <text x="627" y="590" font-size="9.2" fill="#5F6569">Secret Mgr</text>
  <text x="730" y="590" font-size="9.2" fill="#5F6569">Key Vault</text>
  <line x1="444" y1="598" x2="796" y2="598" stroke="#F0F0F0"/>
  <text x="450" y="612" font-size="9.2" fill="#43536B">queue</text>
  <text x="522" y="612" font-size="9.2" fill="#5F6569">SQS</text>
  <text x="627" y="612" font-size="9.2" fill="#5F6569">Pub/Sub</text>
  <text x="730" y="612" font-size="9.2" fill="#5F6569">Service Bus</text>
  <line x1="444" y1="620" x2="796" y2="620" stroke="#F0F0F0"/>
  <text x="450" y="634" font-size="9.2" fill="#43536B">edge.waf</text>
  <text x="522" y="634" font-size="9.2" fill="#5F6569">WAF</text>
  <text x="627" y="634" font-size="9.2" fill="#5F6569">Cloud Armor</text>
  <text x="730" y="634" font-size="9.2" fill="#5F6569">Front Door WAF</text>

  <text x="448" y="654" font-size="9.8" fill="#A9A49C">support 列可为 NONE —— 拓扑图据此禁止画不存在的边</text>

  <!-- 卡片3 标签与区域 -->
  <rect x="820" y="452" width="380" height="212" rx="10" fill="#FFFFFF" stroke="#E2DFD9"/>
  <text x="838" y="474" font-size="12" font-weight="600" fill="#6E5B49">③ tag key 映射 + region_map</text>
  <text x="838" y="494" font-size="10.3" fill="#7A8085">三个规则不一致，是跨云打标失败的头号原因</text>

  <text x="838" y="518" font-size="9.5" fill="#8A9095">canonical：全小写 + 连字符</text>
  <rect x="838" y="524" width="344" height="24" rx="4" fill="#F5F0EA"/>
  <text x="846" y="540" font-size="9.3" fill="#6E5B49" font-family="'SF Mono', Consolas, monospace">cost-center</text>
  <text x="960" y="540" font-size="9.3" fill="#8A7052">→ AWS 原样</text>
  <text x="1050" y="540" font-size="9.3" fill="#8A7052">GCP 必须小写</text>

  <text x="838" y="568" font-size="9.5" fill="#A9715C">写错会怎样：</text>
  <text x="838" y="586" font-size="9.3" fill="#C08B7D">CostCenter → GCP apply 直接失败</text>
  <text x="838" y="602" font-size="9.3" fill="#C08B7D">Cost-Center → Azure 与 cost-center 撞 key</text>

  <line x1="838" y1="614" x2="1182" y2="614" stroke="#F0EDE7"/>
  <text x="838" y="632" font-size="9.5" fill="#8A9095">region_map · 同一个城市三个名字</text>
  <text x="838" y="650" font-size="9.3" fill="#45605E">ap-northeast-1 · asia-northeast1 · japaneast → metro: tokyo</text>

  <!-- ===== 收益 ===== -->
  <rect x="40" y="682" width="1160" height="76" rx="10" fill="#F4F3F0" stroke="#E2DFD9"/>
  <text x="58" y="704" font-size="11.5" font-weight="600" fill="#5F6569">统一之后，多云的五个界面体现</text>
  <text x="58" y="726" font-size="10.5" fill="#7A8085">① 全局 Cloud 维度（所有页面继承）　② 等价资源对照（CloudFront ←→ Cloud CDN ←→ Front Door）　③ 跨云拓扑边　④ 同城跨云单价对比　⑤ 统一漂移判定（aws_ / google_ / azurerm_）</text>
  <text x="58" y="746" font-size="10.5" fill="#B4664F">提醒：统一不等于抹平差异。provider_attrs 保留全部原生属性，过度抽象是另一种坑 —— 统一到"能对比、能串联"就停。</text>

  <text x="40" y="784" font-size="11" fill="#A9A49C">多云的真正价值不是"一个页面看三个云"，而是"能回答跨云的问题"：哪边更便宜、流量走了哪条路、同一套标签在三个云都是什么意思。</text>
</svg>
