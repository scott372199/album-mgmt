<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console One · 基础设施管理平台（V2 原型）</title>
<style>
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --surface2:#FBFAF8; --surface3:#FCFBF9;
  --border:#E7E3DC; --border-soft:#F0EDE7;
  --ink:#2E3134; --ink2:#5F6569; --ink3:#8A9095; --ink4:#B0B5B9;
  --blue:#6B7F94; --blue-bg:#EDF1F4; --blue-bd:#C3CFDA;
  --sage:#8A9A86; --sage-bg:#EFF3EE; --sage-bd:#D3DECF;
  --clay:#C08B7D; --clay-bg:#FAEDE9; --clay-bd:#EBD3CB;
  --sand:#A8907E; --sand-bg:#F7F1E9; --sand-bd:#E7D9C6;
  --lilac:#8C8497; --lilac-bg:#F3F1F5; --lilac-bd:#DAD4E0;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:13.5px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
.app{display:flex; min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{
  width:226px; flex:0 0 226px; background:var(--surface2);
  border-right:1px solid var(--border);
  padding:18px 12px 14px; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; gap:10px; align-items:center; padding:0 6px 18px}
.logo{
  width:32px;height:32px;border-radius:9px;flex:0 0 32px;
  background:linear-gradient(140deg,#7E93A8,#5F7386);
  color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.4px;
  display:flex;align-items:center;justify-content:center;
}
.brand-name{font-size:13.5px;font-weight:600;letter-spacing:-.1px}
.brand-sub{font-size:10.5px;color:var(--ink3);margin-top:-1px}
.nav-group{font-size:10.5px;color:var(--ink4);letter-spacing:.6px;padding:14px 8px 6px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7.5px 9px;border-radius:8px;
  cursor:pointer;color:var(--ink2);font-size:13px;user-select:none;
  transition:background .14s,color .14s;
}
.nav-item:hover{background:#F2F0EB;color:var(--ink)}
.nav-item.on{background:var(--blue-bg);color:#3A4653;font-weight:600}
.nav-item svg{width:15px;height:15px;flex:0 0 15px;opacity:.75}
.nav-item.on svg{opacity:1}
.nav-badge{
  margin-left:auto;font-size:10.5px;padding:0 6px;height:17px;line-height:17px;
  border-radius:9px;background:var(--clay-bg);color:#8A5C4E;font-weight:600;
}
.nav-dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:#B0B5B9}
.side-foot{margin-top:auto;padding:10px 6px 0;border-top:1px solid var(--border)}
.fresh-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);padding:3px 0}
.dot{width:5px;height:5px;border-radius:50%;flex:0 0 5px}
.dot.ok{background:#7F9379} .dot.warn{background:#C9A77E} .dot.bad{background:#BC7C69}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(250,249,247,.88);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  padding:12px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;
}
.page-title{font-size:16px;font-weight:600;letter-spacing:-.2px}
.page-sub{font-size:11px;color:var(--ink3);margin-top:1px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;background:#F1EFEA;border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{
  border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--ink2);
  padding:4px 10px;border-radius:6px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(46,49,52,.07)}
.avatar{
  width:29px;height:29px;border-radius:50%;background:#E4E0D8;color:#6B6560;
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.view{padding:22px 26px 70px;max-width:1440px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.card-h{
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;border-bottom:1px solid var(--border-soft);
}
.card-t{font-size:13px;font-weight:600;letter-spacing:-.1px}
.card-s{font-size:11px;color:var(--ink3);margin-top:2px}
.card-b{padding:16px 18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g-wide{grid-template-columns:1.62fr 1fr}
.row{display:flex;gap:14px}
.muted{color:var(--ink3)}
.tiny{font-size:11px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:'SF Mono',Consolas,'Courier New',monospace;font-size:10.5px}
h3.sec{font-size:12px;font-weight:600;color:var(--ink2);margin:22px 0 10px;letter-spacing:.2px}

.kpi{padding:15px 17px}
.kpi-l{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.kpi-v{font-size:25px;font-weight:600;letter-spacing:-.6px;margin-top:5px}
.kpi-v.sm{font-size:21px}
.kpi-f{font-size:11px;color:var(--ink3);margin-top:6px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.up{color:#B4664F;font-weight:600}
.down{color:#5E7D57;font-weight:600}

.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;
  padding:1.5px 7px;border-radius:20px;border:1px solid transparent;white-space:nowrap;
}
.b-p0{background:var(--clay-bg);color:#8A5C4E;border-color:var(--clay-bd)}
.b-p1{background:var(--sand-bg);color:#8A7052;border-color:var(--sand-bd)}
.b-p2{background:var(--sage-bg);color:#4E6349;border-color:var(--sage-bd)}
.b-info{background:var(--blue-bg);color:#43536B;border-color:var(--blue-bd)}
.b-lilac{background:var(--lilac-bg);color:#5B5468;border-color:var(--lilac-bd)}
.b-plain{background:#F4F3F0;color:#6B7075;border-color:var(--border)}
.b-outline{background:#fff;color:#6B7075;border-color:#C9C4BC}

.chip{
  border:1px solid var(--border);background:#fff;border-radius:7px;padding:4.5px 10px;
  font-size:11.5px;color:var(--ink2);cursor:pointer;transition:.14s;font-family:inherit;
}
.chip:hover{border-color:#CFCAC2}
.chip.on{background:var(--blue-bg);border-color:var(--blue-bd);color:#3A4653;font-weight:600}
.btn{
  border:1px solid var(--border);background:#fff;border-radius:7px;padding:5.5px 11px;
  font-size:11.5px;color:var(--ink2);cursor:pointer;font-family:inherit;transition:.14s;
}
.btn:hover{background:#FAF8F5;border-color:#CFCAC2}
.btn-primary{background:#5F7386;border-color:#5F7386;color:#fff}
.btn-primary:hover{background:#546879;border-color:#546879}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;max-height:640px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl thead th{
  position:sticky;top:0;z-index:2;background:var(--surface3);text-align:left;
  font-weight:500;color:var(--ink3);font-size:11.5px;padding:9px 14px;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
.tbl thead th.sortable{cursor:pointer;user-select:none}
.tbl thead th.sortable:hover{color:var(--ink2)}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FBFAF7}
.tbl .r{text-align:right}
.name{font-weight:500}
.sub{font-size:10.5px;color:var(--ink3);margin-top:1px}

/* ---------- misc ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);align-items:center}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
.bar-row{display:flex;align-items:center;gap:11px;padding:7px 0}
.bar-lbl{width:112px;font-size:12px;color:var(--ink2);flex:0 0 112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:7px;background:#F1EFEA;border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{width:82px;text-align:right;font-size:11.5px;color:var(--ink2);flex:0 0 82px}

.callout{
  display:flex;gap:12px;padding:12px 16px;border-radius:10px;
  background:var(--sand-bg);border:1px solid var(--sand-bd);font-size:12px;color:#7A6450;
}
.callout b{font-weight:600}
.callout.info{background:var(--blue-bg);border-color:var(--blue-bd);color:#43536B}

.item-row{
  display:flex;align-items:center;gap:12px;padding:11px 18px;
  border-bottom:1px solid var(--border-soft);cursor:pointer;
}
.item-row:last-child{border-bottom:0}
.item-row:hover{background:#FBFAF7}
.grow{flex:1;min-width:0}
.arrow{color:var(--ink4);font-size:15px}

.drift-card{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:11px;background:#fff}
.drift-card:hover{border-color:#D8D3CA}
.diff{
  font-family:"SF Mono",Consolas,Monaco,monospace;font-size:11px;line-height:1.7;
  background:#FBFAF8;border:1px solid var(--border-soft);border-radius:7px;
  padding:9px 11px;margin-top:9px;overflow-x:auto;white-space:pre;
}
.diff .neg{color:#A9715C} .diff .pos{color:#5E7D57} .diff .key{color:var(--ink3)}

.matrix{width:100%;border-collapse:collapse;font-size:11.5px}
.matrix th{font-weight:500;color:var(--ink3);font-size:10.5px;padding:7px 9px;text-align:center;border-bottom:1px solid var(--border)}
.matrix td{padding:7px 9px;border-bottom:1px solid var(--border-soft);text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.st{display:inline-block;width:9px;height:9px;border-radius:3px}

/* ---------- tree ---------- */
.tree-row{
  display:flex;align-items:center;gap:9px;padding:7px 14px;
  border-bottom:1px solid var(--border-soft);cursor:pointer;font-size:12.5px;
}
.tree-row:hover{background:#FBFAF7}
.tree-row:last-child{border-bottom:0}
.caret{width:10px;flex:0 0 10px;color:var(--ink4);font-size:9px;text-align:center}

/* ---------- bridge ---------- */
.bridge-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.bridge-lbl{width:128px;flex:0 0 128px;font-size:11.5px;color:var(--ink2)}
.bridge-track{position:relative;flex:1;height:16px;background:#F7F5F1;border-radius:5px;overflow:hidden}
.bridge-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border)}
.bridge-bar{position:absolute;top:3px;height:10px;border-radius:3px}
.bridge-val{width:78px;flex:0 0 78px;text-align:right;font-size:11.5px}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(46,49,52,.16);opacity:0;pointer-events:none;transition:.26s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(560px,92vw);background:#fff;
  border-left:1px solid var(--border);transform:translateX(101%);transition:transform .26s ease;
  z-index:60;overflow-y:auto;box-shadow:-24px 0 50px -34px rgba(46,49,52,.4);
}
.drawer.on{transform:none}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2}
.drawer-b{padding:18px 22px 40px}
.kv{display:flex;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px}
.kv-k{width:120px;flex:0 0 120px;color:var(--ink3);font-size:12px}
.kv-v{flex:1;min-width:0;word-break:break-all}
.tag{display:inline-block;background:#F4F3F0;border:1px solid var(--border);border-radius:5px;
  padding:1.5px 7px;font-size:10.5px;color:var(--ink2);margin:0 5px 5px 0;
  font-family:"SF Mono",Consolas,monospace}
.close{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:#fff;
  cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}

@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr}
  .g-wide,.g2{grid-template-columns:1fr}
}
@media (max-width:820px){
  .sidebar{display:none}
  .view{padding:16px 14px 60px}
  .topbar{padding:10px 14px;flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">C1</div>
      <div>
        <div class="brand-name">Console One</div>
        <div class="brand-sub">基础设施管理平台 · V2</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="fresh-row"><span class="dot ok"></span>三云采集 · 12 分钟前</div>
      <div class="fresh-row"><span class="dot warn"></span>账单 T+2 · 截止 11-14</div>
      <div class="fresh-row"><span class="dot ok"></span>GitHub 事件 · 实时</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <div class="page-title" id="title">总览</div>
        <div class="page-sub" id="sub"></div>
      </div>
      <div class="top-actions">
        <div class="seg" id="segSite">
          <button data-v="ALL" class="on">全部站点</button>
          <button data-v="photos">photos</button>
          <button data-v="management">management</button>
          <button data-v="platform">platform</button>
        </div>
        <div class="seg" id="segBasis">
          <button data-v="allocated" class="on">分摊后</button>
          <button data-v="amortized">摊销</button>
          <button data-v="billed">账单</button>
        </div>
        <div class="seg" id="segCur">
          <button data-v="CNY" class="on">CNY</button>
          <button data-v="USD">USD</button>
        </div>
        <button class="chip" data-sources="1" title="展开三云与 CI 各自的最后成功时间"
          style="display:flex;align-items:center;gap:6px"><span class="dot ok"></span>数据 12 分钟前</button>
        <div class="avatar">ZY</div>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
/* ============================================================
   状态与工具
   ============================================================ */
const RATE = 7.12;
const state = {
  page:'overview', basis:'allocated', cur:'CNY', site:'ALL',
  q:'', cloud:'ALL', catView:'list', sort:{k:'c',d:'desc'},
  driftTab:'ALL', sel:'photos/01-storage', tree:{}, inferred:false, graphView:'layer'
};

const BASIS_LABEL = {allocated:'分摊后口径', amortized:'摊销口径', billed:'账单口径'};
const BASIS_NOTE = {
  allocated:'共享成本按规则再分配 · 内部结算用',
  amortized:'RI/SP 预付按使用期分摊',
  billed:'当期开票金额 · 财务付款与对账'
};

function money(usd, opt){
  opt = opt || {};
  const mult = state.basis==='billed' ? 1.038 : (state.basis==='amortized' ? 0.994 : 1);
  let v = usd * mult;
  if(state.cur === 'CNY') v *= RATE;
  const sym = state.cur === 'CNY' ? '¥' : '$';
  if(opt.raw) return sym + Math.round(v).toLocaleString('en-US');
  if(state.cur === 'CNY' && v >= 10000) return sym + (v/10000).toFixed(1) + '万';
  if(state.cur === 'USD' && v >= 10000) return sym + (v/1000).toFixed(1) + 'k';
  if(v >= 1000) return sym + Math.round(v).toLocaleString('en-US');
  return sym + v.toFixed(v < 10 ? 1 : 0);
}
const pct = (a,b) => (b ? (a/b*100) : 0).toFixed(1);

/* ============================================================
   结构常量：站点 / 层
   ============================================================ */
const SITES = {
  'photos':      {n:'图片站', plane:'DATA',    color:'#6B7F94', bg:'#EDF1F4', bd:'#C3CFDA', clouds:'AWS + GCP 双活'},
  'management':  {n:'管理站', plane:'OBS',     color:'#8A9A86', bg:'#EFF3EE', bd:'#D3DECF', clouds:'AWS'},
  'platform':    {n:'平台站', plane:'CONTROL', color:'#C08B7D', bg:'#FAEDE9', bd:'#E3C7BE', clouds:'Azure'},
  's00-account': {n:'共享层', plane:'CONTROL', color:'#8C8497', bg:'#F3F1F5', bd:'#DAD4E0', clouds:'Azure'}
};
/* 层号 = apply 顺序：00 先 apply，04 最后。图上自上而下是依赖方向，自下而上是 apply 方向 */
const LAYERS = [
  {n:4, id:'04-edge',      cn:'入口', y:44},
  {n:3, id:'03-compute',   cn:'计算', y:138},
  {n:2, id:'02-data',      cn:'数据', y:232},
  {n:1, id:'01-storage',   cn:'存储', y:326},
  {n:0, id:'00-bootstrap', cn:'基座', y:420}
];
const BAND_H = 86;

/* ============================================================
   模拟数据：16 个层节点 = s00-account + 3 站 × 5 层
   ============================================================ */
const NODES = [
  {id:'photos/04-edge',     site:'photos', L:4, l:'图片分发入口',   res:18, cost:4200,  tier:'P0', t:'CloudFront + WAF'},
  {id:'photos/03-compute',  site:'photos', L:3, l:'图片处理服务',   res:42, cost:16800, tier:'P0', t:'ECS + Lambda'},
  {id:'photos/02-data',     site:'photos', L:2, l:'元数据与索引',   res:14, cost:9600,  tier:'P0', t:'RDS + OpenSearch'},
  {id:'photos/01-storage',  site:'photos', L:1, l:'原图与派生图',   res:9,  cost:8800,  tier:'P0', t:'S3 主 + GCS 备'},
  {id:'photos/00-bootstrap',site:'photos', L:0, l:'账号基线与网络', res:11, cost:2700,  tier:'P0', t:'VPC / IAM / KMS'},

  {id:'management/04-edge',     site:'management', L:4, l:'运维入口',           res:6,  cost:600,  tier:'P1', t:'VPN + 内部 ALB'},
  {id:'management/03-compute',  site:'management', L:3, l:'运维工具与 Runner',  res:12, cost:2200, tier:'P1', t:'EC2 ASG'},
  {id:'management/02-data',     site:'management', L:2, l:'运维数据',           res:5,  cost:1500, tier:'P2', t:'DynamoDB'},
  {id:'management/01-storage',  site:'management', L:1, l:'日志归档与备份',     res:7,  cost:1900, tier:'P1', t:'S3 + Glacier'},
  {id:'management/00-bootstrap',site:'management', L:0, l:'观测面基线',         res:8,  cost:700,  tier:'P1', t:'VPC / IAM'},

  {id:'platform/04-edge',     site:'platform', L:4, l:'平台入口',   res:4,  cost:1900, tier:'P1', t:'Front Door'},
  {id:'platform/03-compute',  site:'platform', L:3, l:'平台服务',   res:16, cost:3800, tier:'P1', t:'Container Apps'},
  {id:'platform/02-data',     site:'platform', L:2, l:'平台库',     res:7,  cost:5000, tier:'P1', t:'PG Flexible'},
  {id:'platform/01-storage',  site:'platform', L:1, l:'快照与导出', res:5,  cost:1200, tier:'P2', t:'Blob'},
  {id:'platform/00-bootstrap',site:'platform', L:0, l:'控制面基线', res:6,  cost:500,  tier:'P1', t:'RG / MI / KV'},

  {id:'s00-account', site:'s00-account', L:-1, l:'共享层', res:14, cost:900, tier:'P0', t:'组织 / 账号 / state / DNS'}
];
const NODE = Object.fromEntries(NODES.map(n=>[n.id,n]));
const TOTAL_RES = NODES.reduce((a,b)=>a+b.res,0);

/* 边：方向恒为「被依赖 → 依赖」（图上自上而下）。跨站点只允许指向共享层 */
const EDGES = [
  {f:'photos/04-edge',t:'photos/03-compute',ev:'栈结构',c:1.00,why:'04-edge 清单声明依赖 03-compute，service 选择器绑定其输出',src:'photos/04-edge/layers.yaml:18'},

/* ============================================================

   ============================================================ */
function chartStacked(){
  const W=760, H=252, pad={l:52,r:14,t:16,b:28};
  const series=[
    {k:'photos',     c:'#6B7F94', v:COST.photos},
    {k:'management', c:'#8A9A86', v:COST.management},
    {k:'platform',   c:'#C08B7D', v:COST.platform},
    {k:'共享',       c:'#B9B3C2', v:COST.shared}
  ];
  const n=MONTHS.length;
  const tot=MONTHS.map((_,i)=>series.reduce((a,s)=>a+s.v[i],0));
  const max=Math.max(...tot, ...COST.budget)*1.14;
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b, step=iw/n, bw=step*0.52;
  const Y=v=>pad.t+ih*(1-v/max);
  let s='';
  for(let i=0;i<=4;i++){
    const y=pad.t+ih*i/4, val=max*(1-i/4);
    s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#F0EDE7" stroke-width="1"/>`;
    s+=`<text x="${pad.l-9}" y="${y+3.5}" font-size="9.5" fill="#B0B5B9" text-anchor="end">${Math.round(val/1000)}k</text>`;
  }
  for(let i=0;i<n;i++){
    const x=pad.l+step*i+(step-bw)/2;
    let base=0;
    for(const se of series){
      const v=se.v[i];
      const y0=Y(base+v), y1=Y(base);
      s+=`<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(0,y1-y0)}" fill="${se.c}" rx="1.5" opacity="0.92">`
        +`<title>${MONTHS[i]} · ${se.k} · $${v.toLocaleString()}</title></rect>`;
      base+=v;
    }
    if(i%2===0) s+=`<text x="${x+bw/2}" y="${H-8}" font-size="9.5" fill="#A9A49C" text-anchor="middle">${MONTHS[i]}</text>`;
  }
  const pts=COST.budget.map((v,i)=>`${pad.l+step*i+step/2},${Y(v)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" stroke="#8C8497" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/>`;
  COST.budget.forEach((v,i)=>{
    s+=`<circle cx="${pad.l+step*i+step/2}" cy="${Y(v)}" r="2.6" fill="#fff" stroke="#8C8497" stroke-width="1.4"><title>预算 $${v.toLocaleString()}</title></circle>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${s}</svg>`;
}

function spark(vals, color, W, H){
  W=W||96; H=H||28;
  const min=Math.min(...vals), max=Math.max(...vals), rg=(max-min)||1;
  const Y=v=>H-2-((v-min)/rg)*(H-6);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*W},${Y(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;flex:0 0 auto">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity=".10"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${W}" cy="${Y(vals[vals.length-1])}" r="2.2" fill="${color}"/>
  </svg>`;
}

function hbars(items, color){
  const max=Math.max(...items.map(i=>i.v));
  return items.map(i=>`
    <div class="bar-row">
      <div class="bar-lbl" title="${i.k}">${i.k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||color}"></div></div>
      <div class="bar-val num">${money(i.v)}</div>
    </div>`).join('');
}

/* 差异桥：以中线为 0，正向向右，负向向左 */
function bridgeRow(k, v, note){
  const maxAbs=900;
  const w=Math.min(Math.abs(v)/maxAbs*50, 50);
  const left=v>=0?50:50-w;
  const col=v>=0?'#86997F':'#C08B7D';
  return `<div class="bridge-row">
    <div class="bridge-lbl">${k}</div>
    <div class="bridge-track">
      <div class="bridge-mid"></div>
      <div class="bridge-bar" style="left:${left}%;width:${w}%;background:${col}"></div>
    </div>
    <div class="bridge-val num" style="color:${v>=0?'#5E7D57':'#B4664F'};font-weight:600">${v>0?'+':'−'}${money(Math.abs(v),{raw:1})}</div>
    <div class="tiny muted" style="flex:0 0 196px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${note}">${note}</div>
  </div>`;
}

function allocStep(s, total){

}

const COLX = {photos:158, management:382, platform:606};
const NODEW = 200, NODEH = 64;
const BANDY = {4:44, 3:138, 2:232, 1:326, 0:420};
const LANE_DX = 14;

function geoOf(id){
  const n=NODE[id];
  if(n.site==='s00-account') return [900, 44, 126, 462];
  return [COLX[n.site], BANDY[n.L]+11, NODEW, NODEH];
}
const EV_COLOR = {'栈结构':'#8A9A86','remote_state':'#86997F','配置引用':'#A8907E','流量日志':'#7E9A99','标签推断':'#B0B5B9'};
const GRAPH_TITLE={layer:'分层视图 · 站点与层',flow:'数据流视图 · 入口到存储',cost:'成本视图 · 钱压在哪一层'};
const GRAPH_DESC={
  layer:'节点 =（站点，层），共 16 个 · 实线 = 结构或 remote_state（1.00）· 虚线 = 配置引用（0.90）或流量推断（0.85）· 点线 = 弱推断（默认不画）',
  flow:'只保留数据真正流经的边，基座层淡化 —— 回答「一次请求从入口到落盘经过谁」',
  cost:'节点底色深浅与底部占比条映射月成本，只留结构关系 —— 回答「改哪一层的钱最贵」'
};

function relOf(id){
  const rev={},fwd={};
  EDGES.filter(e=>!e.weak).forEach(e=>{(rev[e.t]=rev[e.t]||[]).push(e.f);(fwd[e.f]=fwd[e.f]||[]).push(e.t);});
  const bfs=(adj,limit)=>{const seen={[id]:0},q=[[id,0]],out=[];
    while(q.length){const [n,d]=q.shift(); if(d>=limit) continue;
      (adj[n]||[]).forEach(m=>{ if(seen[m]===undefined){seen[m]=d+1;q.push([m,d+1]);out.push([m,d+1]);} });}
    return out;};
  const imp=bfs(rev,3), dep=bfs(fwd,3);
  return {imp,dep,
    imp1:imp.filter(x=>x[1]===1).map(x=>x[0]),
    imp2:imp.filter(x=>x[1]>1).map(x=>x[0]),
    dep1:dep.filter(x=>x[1]===1).map(x=>x[0])};
}

function topoSvg(sel){
  const view=state.graphView||'layer';
  const maxCost=Math.max(...NODES.map(x=>x.cost));
  const r=relOf(sel);
  const near=new Set([sel,...r.imp1,...r.dep1]);
  const siteOn = state.site==='ALL' ? null : state.site;
  let s='';
  LAYERS.forEach((L,i)=>{
    s+=`<rect x="76" y="${L.y}" width="812" height="${BAND_H}" rx="8" fill="${i%2?'#FBFAF8':'#FFFFFF'}" stroke="#EDEAE4"/>`;
    s+=`<text x="14" y="${L.y+26}" font-size="11" font-weight="600" fill="#8A9095">L${L.n}</text>`;
    s+=`<text x="14" y="${L.y+40}" font-size="9.2" fill="#A9A49C">${L.id}</text>`;
    s+=`<text x="14" y="${L.y+54}" font-size="9.2" fill="#C0BCB4">${L.cn}</text>`;
  });
  s+=`<rect x="900" y="44" width="126" height="462" rx="8" fill="#F3F1F5" stroke="#DAD4E0"/>`;
  s+=`<text x="963" y="70" font-size="11" font-weight="600" fill="#5B5468" text-anchor="middle">S00 · 共享</text>`;
  s+=`<text x="963" y="86" font-size="8.6" fill="#8C8497" text-anchor="middle">被 15 个层引用</text>`;

  EDGES.forEach(e=>{
    if(e.weak && !state.inferred) return;
    if(view==='flow' && e.ev==='栈结构' && e.t.indexOf('00-bootstrap')>=0) return;
    if(view==='cost' && e.ev==='流量日志') return;
    const A=geoOf(e.f), B=geoOf(e.t);
    const hot=(e.f===sel||e.t===sel);
    const col=e.weak?'#B0B5B9':EV_COLOR[e.ev];
    const dash=e.weak?'stroke-dasharray="2 3"':(e.c<=0.90?'stroke-dasharray="5 3"':'');
    const mk=`marker-end="url(#tg-${hot?'h':'n'})"`;
    const op=hot?1:(view==='cost'?0.2:0.34);
    if(e.route==='left'){
      const x0=A[0], y0=A[1]+A[3]/2;
      const lane=x0-LANE_DX;
      const x1=B[0], y1=B[1]+B[3]/2;
      s+=`<path d="M${x0},${y0} H${lane} V${y1} H${x1}" fill="none" stroke="${col}"
          stroke-width="${hot?2:1.2}" ${dash} opacity="${op}" ${mk}/>`;
      return;
    }
    const x1=A[0]+A[2]/2, y1=A[1]+A[3], x2=B[0]+B[2]/2, y2=B[1]-1;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${hot?2:1.2}"
        ${dash} opacity="${op}" ${mk}/>`;
  });

  NODES.forEach(n=>{
    const g=geoOf(n.id);
    const x=g[0], y=g[1], w=g[2], h=g[3];
    const S=SITES[n.site];
    const on=n.id===sel, near1=near.has(n.id);
    const dim = siteOn && n.site!==siteOn && n.site!=='s00-account';
    const strip = n.site==='s00-account';
    const base = view==='flow' && n.L===0;
    const heat = view==='cost' ? (0.45+0.55*(n.cost/maxCost)) : 1;
    s+=`<g data-node="${n.id}" style="cursor:pointer" opacity="${dim?0.28:(base?0.3:(near1?heat:0.42*heat))}">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${S.bg}" stroke="${on?S.color:S.bd}" stroke-width="${on?2:1}"/>
      <rect x="${x}" y="${y}" width="3.5" height="${h}" rx="1.75" fill="${S.color}"/>
      <text x="${x+w/2}" y="${y+(strip?26:24)}" font-size="${strip?11:12.5}" font-weight="600" fill="#2E3134" text-anchor="middle">${strip?'s00-account':n.l}</text>
      <text x="${x+w/2}" y="${y+(strip?42:40)}" font-size="${strip?8.4:9.6}" fill="${S.color}" text-anchor="middle">${strip?'组织 / 账号 / state':n.site+'/'+LAYERS.find(l=>l.n===n.L).id}</text>
      ${strip
        ? `<text x="${x+w/2}" y="${y+58}" font-size="8.2" fill="#A9A49C" text-anchor="middle">${n.res} 资源 · ${money(n.cost)}/月</text>
           <text x="${x+11}" y="${y+96}" font-size="8.2" fill="#8C8497">· 组织与账号 vending</text>
           <text x="${x+11}" y="${y+114}" font-size="8.2" fill="#8C8497">· Budgets 与告警</text>
           <text x="${x+11}" y="${y+132}" font-size="8.2" fill="#8C8497">· tfstate 桶 + lease</text>
           <text x="${x+11}" y="${y+150}" font-size="8.2" fill="#8C8497">· Key Vault</text>
           <text x="${x+11}" y="${y+168}" font-size="8.2" fill="#8C8497">· Azure DNS</text>
           <text x="${x+11}" y="${y+204}" font-size="8" fill="#B0A9BC">15 条 remote_state</text>
           <text x="${x+11}" y="${y+218}" font-size="8" fill="#B0A9BC">不画线，避免糊成一片</text>`
        : `<text x="${x+w/2}" y="${y+h-11}" font-size="9.2" fill="#A9A49C" text-anchor="middle">${n.res} 资源 · ${money(n.cost)}/月</text>
           ${view==='cost'?`<rect x="${x+9}" y="${y+h-6}" width="${(w-18)*n.cost/maxCost}" height="3" rx="1.5" fill="${S.color}" opacity=".8"/>`:''}`}
    </g>`;
  });

  return `<svg viewBox="0 0 1040 528" style="width:100%;height:auto;display:block">
    <defs>
      <marker id="tg-n" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#B0B5B9"/></marker>
      <marker id="tg-h" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#6B7075"/></marker>
    </defs>${s}
    <text x="76" y="524" font-size="9.2" fill="#A9A49C">层号 = apply 顺序：自下而上（00 先、04 后）· 站点之间并行，站点之内串行 · 箭头方向为「依赖谁」</text>
  </svg>`;
}

/* ---------- 视图 2：域树（云 → 账号 → 站点 → 层 → 资源） ---------- */
function treeView(){
  const list=filteredRes();
  const clouds={};
  list.forEach(r=>{
    const c=clouds[r.p]=clouds[r.p]||{};
    const a=c[r.a]=c[r.a]||{};
    const s=a[r.site]=a[r.site]||{};
    (s[r.layer]=s[r.layer]||[]).push(r);
  });
  const open=k=>state.tree[k]===true;
  const sum=rs=>rs.reduce((a,b)=>a+b.c,0);
  let out='';
  Object.keys(clouds).sort().forEach(cl=>{
    const accts=clouds[cl];
    const cAll=Object.keys(accts).flatMap(a=>Object.keys(accts[a]).flatMap(s=>Object.keys(accts[a][s]).flatMap(l=>accts[a][s][l])));
    out+=treeRow(0,cl,cl+' · '+cAll.length+' 个资源 · 账号 '+Object.keys(accts).length,money(sum(cAll)),!open(cl),cl,false,'#8A9095');
    if(!open(cl)) return;
    Object.keys(accts).sort().forEach(ac=>{
      const sites=accts[ac];
      const aAll=Object.keys(sites).flatMap(s=>Object.keys(sites[s]).flatMap(l=>sites[s][l]));
      const k1=cl+'|'+ac;
      out+=treeRow(1,ac,ac+' · '+aAll.length+' 个资源',money(sum(aAll)),!open(k1),k1,false,'#A8907E');
      if(!open(k1)) return;
      Object.keys(sites).sort().forEach(st=>{
        const layers=sites[st];
        const sAll=Object.keys(layers).flatMap(l=>layers[l]);
        const S=SITES[st]||{color:'#8A9095',n:st,plane:'—',clouds:'—'};
        out+=treeRow(2,st+' · '+S.n,S.plane+' 平面 · '+S.clouds,money(sum(sAll)),false,null,true,S.color);
        Object.keys(layers).sort().reverse().forEach(ly=>{
          const rs=layers[ly];
          out+=treeRow(3,ly,rs.length+' 个资源',money(sum(rs)),false,null,true,S.color);
          rs.forEach(r=>{
            out+=`<div class="tree-row" data-res="${RESOURCES.indexOf(r)}" style="padding-left:96px">
              <span class="caret"></span>
              <div class="grow" style="font-size:12px">${r.n}
                <span class="tiny muted" style="margin-left:6px">${r.t}${r.tf==='—'?' · 未纳管':''}</span></div>
              <span class="num tiny muted" style="width:82px;text-align:right">${r.c?money(r.c):'—'}</span>
            </div>`;
          });
        });
      });
    });
  });
  return `<div class="card">${out||'<div class="card-b tiny muted">没有匹配的资源</div>'}</div>`;
}

function treeRow(depth, name, sub, cost, collapsed, key, noToggle, color){
  const pad=16+depth*22;
  return `<div class="tree-row" ${key?`data-tree="${key}"`:''} style="padding-left:${pad}px">
    <span class="caret">${noToggle?'':(collapsed?'▸':'▾')}</span>
    <span style="width:3px;height:16px;border-radius:2px;background:${color||'#8A9095'}"></span>
    <div class="grow"><span style="font-size:${depth<2?12.5:12}px;font-weight:${depth<2?600:500}">${name}</span>
      <span class="tiny muted" style="margin-left:7px">${sub}</span></div>
    <span class="num tiny" style="width:86px;text-align:right;color:var(--ink2)">${cost}</span>
  </div>`;
}

function layerView(){

        </div>

      </div>
      ${untag?`<div class="tiny" style="margin-top:8px;color:#A9715C">${untag} 个资源无标签 · 成本无法按规则分摊</div>`:''}

  }).filter(Boolean);
  return `<div class="grid g3">${cards.join('')||'<div class="card card-b tiny muted">没有匹配的资源</div>'}</div>`;
}

function filteredRes(){
  let list=RESOURCES.slice();
  if(state.site!=='ALL') list=list.filter(r=>r.site===state.site);
  if(state.cloud!=='ALL') list=list.filter(r=>r.p===state.cloud);
  if(state.q){
    const q=state.q.toLowerCase();
    list=list.filter(r=>{
      const tagStr=r.tags?Object.keys(r.tags).map(k=>k+'='+r.tags[k]).join(' '):'';
      return (r.n+' '+r.t+' '+r.p+' '+r.a+' '+r.site+' '+r.layer+' '+tagStr).toLowerCase().includes(q);
    });
  }
  const k=state.sort.k, d=state.sort.d==='asc'?1:-1;
  list.sort((a,b)=>{
    if(k==='c'||k==='d') return (a[k]-b[k])*d;
    return String(a[k]||'').localeCompare(String(b[k]||''))*d;
  });
  return list;
}

    return `<tr data-res="${RESOURCES.indexOf(r)}" ${!r.canon?'style="opacity:.62"':''}>

  }).join('');
}

function chainHtml(sel){
  const r=relOf(sel);
  const node=NODE[sel];
  const rows=[`<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">
    <span class="badge b-plain" style="min-width:56px;justify-content:center">${node.site==='s00-account'?'S00':'L'+node.L}</span>
    <span style="font-size:13px;font-weight:600">${node.site==='s00-account'?'s00-account':node.l}</span>
    <span class="tiny muted">被修改</span></div>`];
  if(!r.imp.length){
    rows.push('<div class="tiny muted">没有站内节点依赖它 —— 但它通过 remote_state 被所有站点读取，影响面在共享层</div>');
    return rows.join('');
  }
  const byDepth={};
  r.imp.forEach(([id,d])=>{(byDepth[d]=byDepth[d]||[]).push(id);});
  Object.keys(byDepth).sort().forEach(d=>{
    rows.push(`<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:9px;padding-left:${d*22}px">
      <span class="tiny muted" style="flex:0 0 22px">↖</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${byDepth[d].map(id=>`<span class="badge ${d==1?'b-p0':'b-p1'}">${NODE[id].l}</span>`).join('')}
      </div>
      <span class="tiny muted">${d==1?'直接影响':'第 '+d+' 跳'}</span></div>`);
  });
  return rows.join('');
}

function funnel(k,v,total,color){
  return `<div class="bar-row">
    <div class="bar-lbl">${k}</div>
    <div class="bar-track" style="height:9px">
      <div class="bar-fill" style="width:${(v/total*100).toFixed(0)}%;background:${color}"></div>
    </div>
    <div class="bar-val num">${v}</div>
  </div>`;
}
function tl(t,title,desc,color){
  return `<div style="display:flex;gap:11px;padding:6px 0">
    <div style="flex:0 0 82px" class="tiny muted">${t}</div>
    <div style="flex:0 0 7px;display:flex;flex-direction:column;align-items:center">
      <span style="width:7px;height:7px;border-radius:50%;background:${color};margin-top:5px"></span>
      <span style="flex:1;width:1px;background:var(--border)"></span>
    </div>
    <div style="padding-bottom:6px">
      <div style="font-size:12px;font-weight:500">${title}</div>
      <div class="tiny muted">${desc}</div>
    </div>
  </div>`;
}

  overview:'<rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>',
  catalog:'<path d="M8 2 14 5 8 8 2 5z"/><path d="M2 8.5 8 11.5 14 8.5"/><path d="M2 11.5 8 14.5 14 11.5"/>',
  graph:'<circle cx="8" cy="3.2" r="1.8"/><circle cx="3.2" cy="12" r="1.8"/><circle cx="12.8" cy="12" r="1.8"/><path d="M7 4.6 4 10.4M9 4.6 12 10.4M5 12h6"/>',
  cost:'<path d="M2 13V7M5.7 13V4M9.4 13V9M13 13V2"/>',
  drift:'<circle cx="3.5" cy="8" r="2"/><circle cx="12.5" cy="8" r="2"/><path d="M5.5 8h5" stroke-dasharray="2 1.6"/>',
  pipeline:'<circle cx="8" cy="8" r="6"/><path d="M6.5 5.5 10.5 8l-4 2.5z"/>',
  sec:'<path d="M8 1.8 13.2 4v3.8c0 3-2.2 5.3-5.2 6.4-3-1.1-5.2-3.4-5.2-6.4V4z"/>',
  alert:'<path d="M8 2a4 4 0 0 0-4 4v3l-1.5 2.5h11L12 9V6a4 4 0 0 0-4-4z"/><path d="M6.6 13.6a1.5 1.5 0 0 0 2.8 0"/>',
  dr:'<path d="M2.5 5.6h9M9 3.1 11.5 5.6 9 8.1"/><path d="M13.5 11.4h-9M7 8.9 4.5 11.4 7 13.9"/>'
};

const NAV=[
  {g:'运营',items:[
    {id:'overview',label:'总览',icon:'overview'},
    {id:'catalog',label:'资源目录',icon:'catalog'},
    {id:'graph',label:'栈图谱',icon:'graph'},
    {id:'cost',label:'成本',icon:'cost'}
  ]},
  {g:'治理',items:[
    {id:'pipeline',label:'发布',icon:'pipeline',dot:true},
    {id:'drift',label:'漂移',icon:'drift',badge:'2'},
    {id:'sec',label:'安全',icon:'sec'},
    {id:'dr',label:'容灾矩阵',icon:'dr',dot:true}
  ]},
  {g:'响应',items:[
    {id:'alerts',label:'告警与事件',icon:'alert',dot:true}
  ]}
];

const META={
  overview:{t:'总览',s:()=>`受管 ${TOTAL_RES} 个资源 · 4 站点 16 层 · ${BASIS_LABEL[state.basis]} · 数据 12 分钟前`},
  catalog:{t:'资源目录',s:()=>`示例集 ${RESOURCES.length} 条 · 全量 ${TOTAL_RES+3} 条 · 未归类 3 个 · 采集于 2026-11-16 02:12`},
  graph:{t:'栈图谱',s:()=>`16 个节点 · 已画 16 条关系 · 2 条弱推断默认不画 · ${SHARED_REFS} 条共享层引用不画线`},
  cost:{t:'成本',s:()=>`账单截止 2026-11-14 · ${BASIS_LABEL[state.basis]} · USD→CNY 7.12 · 精度：汇总`},
  drift:{t:'漂移',s:()=>`通道 A 每日 03:00 · 通道 B 每周日 04:00 · 覆盖率 ${pct(DRIFT_COVER.checked,DRIFT_COVER.managed)}%`},
  pipeline:{t:'发布',s:()=>`GitHub App 实时接入 · 46 个仓库 · 事件延迟 < 10s`},
  sec:{t:'安全',s:()=>`最近扫描 2026-11-16 05:00 · 只给清单与分布，不给总分`},
  dr:{t:'容灾矩阵',s:()=>`6 个组件 · 1 项超 90 天未演练 · 前置条件 5/6 就位`},
  alerts:{t:'告警与事件',s:()=>`实时 · 今日 186 条告警收敛为 62 个事件`}
};

const PAGES={overview:pageOverview,catalog:pageCatalog,graph:pageGraph,cost:pageCost,
  drift:pageDrift,pipeline:pagePipeline,sec:pageSec,dr:pageDr,alerts:pageAlerts};

/* 路由：#/ #/catalog #/graph #/cost #/drift #/pipeline #/sec #/dr #/alerts */
const ROUTES={overview:'#/',catalog:'#/catalog',graph:'#/graph',cost:'#/cost',
  drift:'#/drift',pipeline:'#/pipeline',sec:'#/sec',dr:'#/dr',alerts:'#/alerts'};
const PAGE_OF={};
Object.keys(ROUTES).forEach(k=>{PAGE_OF[ROUTES[k]]=k;});

function hashFor(){
  let h=ROUTES[state.page]; const qs=[];
  if(state.page==='catalog'){
    if(state.site!=='ALL') qs.push('site='+state.site);
    if(state.cloud!=='ALL') qs.push('cloud='+state.cloud);
    if(state.catView!=='list') qs.push('view='+state.catView);
    if(state.q) qs.push('q='+encodeURIComponent(state.q));
  }
  if(state.page==='drift' && state.driftTab!=='ALL') qs.push('sev='+state.driftTab);
  return qs.length ? h+'?'+qs.join('&') : h;
}
/* 筛选条件写进 URL：刷新、分享后结果一致 */
function applyQuery(){
  let qs='';
  try{ qs=(location.hash||'').split('?')[1]||''; }catch(e){}
  const q=new URLSearchParams(qs);
  if(state.page==='catalog'){
    state.site=q.get('site')||'ALL';
    state.cloud=q.get('cloud')||'ALL';
    state.catView=q.get('view')||'list';
    state.q=q.get('q')||'';
  }else if(state.page==='drift'){
    state.driftTab=q.get('sev')||'ALL';
  }
}
function syncHash(){
  try{
    const want=hashFor();
    if(location.hash===want) return;
    const cur=(location.hash||'#/').split('?')[0];
    if(cur===want.split('?')[0]) location.replace(want); else location.hash=want;
  }catch(e){}
}

function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(g=>`
    <div class="nav-group">${g.g}</div>
    ${g.items.map(it=>`<div class="nav-item ${state.page===it.id?'on':''}" data-page="${it.id}">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">${ICONS[it.icon]}</svg>
      <span>${it.label}</span>
      ${it.badge?`<span class="nav-badge">${it.badge}</span>`:(it.dot?'<span class="nav-dot"></span>':'')}
    </div>`).join('')}
  `).join('');
}

function render(){
  renderNav();
  document.getElementById('view').innerHTML=PAGES[state.page]();
  document.getElementById('title').textContent=META[state.page].t;
  document.getElementById('sub').textContent=META[state.page].s();
  document.querySelectorAll('#segBasis button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.basis));
  document.querySelectorAll('#segCur button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.cur));
  document.querySelectorAll('#segSite button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.site));
  syncCount();
  syncHash();
}

/* ---------- 事件 ---------- */
function closeDrawer(){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-page]');
  if(nav){ closeDrawer(); state.page=nav.dataset.page; window.scrollTo({top:0}); render(); return; }

  const seg=e.target.closest('#segBasis button');
  if(seg){ state.basis=seg.dataset.v; render(); return; }
  const seg2=e.target.closest('#segCur button');
  if(seg2){ state.cur=seg2.dataset.v; render(); return; }
  const seg3=e.target.closest('#segSite button');
  if(seg3){ state.site=seg3.dataset.v; render(); return; }

  const st=e.target.closest('[data-site]');
  if(st){ state.site=st.dataset.site;
    document.querySelectorAll('#segSite button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.site));
    render(); return; }

  const gn=e.target.closest('[data-node]');
  if(gn){ state.sel=gn.dataset.node; render(); return; }

  const cv=e.target.closest('#catView button');
  if(cv){ state.catView=cv.dataset.view;
    document.querySelectorAll('#catView button').forEach(b=>b.classList.toggle('on',b.dataset.view===state.catView));
    const b=document.getElementById('catBody'); if(b){ b.innerHTML=catBody(); syncCount(); syncHash(); } return; }

  const cl=e.target.closest('[data-cloud]');
  if(cl){ state.cloud=cl.dataset.cloud;
    document.querySelectorAll('#cloudChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.cloud===state.cloud));
    const b=document.getElementById('catBody'); if(b){ b.innerHTML=catBody(); syncCount(); syncHash(); } return; }

  const th=e.target.closest('th[data-sort]');
  if(th){ const k=th.dataset.sort;
    state.sort = (state.sort.k===k) ? {k,d:state.sort.d==='asc'?'desc':'asc'} : {k,d:'asc'};
    const b=document.getElementById('catBody'); if(b){ b.innerHTML=catBody(); syncCount(); } return; }

  const tree=e.target.closest('[data-tree]');
  if(tree){ const k=tree.dataset.tree; state.tree[k]=!state.tree[k];
    const b=document.getElementById('catBody'); if(b){ b.innerHTML=catBody(); syncCount(); } return; }

  const tab=e.target.closest('[data-tab]');
  if(tab){ state.driftTab=tab.dataset.tab;
    document.querySelectorAll('#driftTabs .chip').forEach(c=>c.classList.toggle('on',c.dataset.tab===state.driftTab));
    const el=document.getElementById('driftList'); if(el) el.innerHTML=driftList();
    syncHash(); return; }

  const gv=e.target.closest('[data-gview]');
  if(gv){ state.graphView=gv.dataset.gview; render(); return; }

  const inf=e.target.closest('[data-inferred]');
  if(inf){ state.inferred=!state.inferred; render(); return; }

  const dr=e.target.closest('[data-drift]');
  if(dr){ openDrift(dr.dataset.drift); return; }

  const run=e.target.closest('[data-run]');
  if(run){ openRun(run.dataset.run); return; }

  const sr=e.target.closest('[data-sources]');
  if(sr){ openSources(); return; }

  const tr=e.target.closest('[data-res]');
  if(tr){ openResource(+tr.dataset.res); return; }

  if(e.target.closest('[data-close]')||e.target.id==='scrim'){ closeDrawer(); return; }
});

document.addEventListener('input',e=>{
  if(e.target.id==='resSearch'){
    state.q=e.target.value;
    const b=document.getElementById('catBody');
    if(b){ b.innerHTML=catBody(); syncCount(); syncHash(); }
  }
});

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* 初始路由：地址栏可复制分享，前进后退可用 */
try{
  const p0=PAGE_OF[(location.hash||'#/').split('?')[0]];
  if(p0) state.page=p0;
  applyQuery();
  window.addEventListener('hashchange',()=>{
    if(location.hash===hashFor()) return;      /* 自己写回的，不重复渲染 */
    const path=(location.hash||'#/').split('?')[0];
    const p=PAGE_OF[path];
    if(p){ closeDrawer(); state.page=p; applyQuery(); render(); window.scrollTo({top:0}); }
  });
}catch(e){}
render();
</script>
</body>
</html>
